[AUTHOR]
NAME=Saugroboter Plugin Authors
EMAIL=saugroboter@users.noreply.github.com

[PLUGIN]
VERSION=1.0.1
NAME=saugrobo
FOLDER=saugrobo
TITLE=Saugroboter (Valetudo)

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
# Bei einem neuen Release: VERSION hier und in release.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Saugroboter/main/release.cfg
PRERELEASECFG=

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0
LB_MAXIMUM=false
ARCHITECTURE=false
